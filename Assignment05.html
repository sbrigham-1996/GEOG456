<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-sscale=1.0">
  <title>Florida Population Density by County</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="./floridaDensity.js"></script>
</head>
<body>

  <h1>Geovisualizing Population Density in Florida<br>Persons per km<sup>2</sup></h1>
  <h2>Move the slider below to display population densities of Florida's counties by decade</h2>
  <h3 id="daYear">Year: 1930</h3>
  <h3>Click the counties to see population density for perspective county</h3>
  <input id="year" type="range" name="year" min="1930" max="2020" step="10" value="1930" oninput="moveSlider(this.value)">
  <div id="map"></div>
  <div class="legend"></div>

  <script>
    //  Initialize the map
    var map = L.map('map').setView([27.99, -81.76], 6);
    L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {}).addTo(map);

    //  Set initial selected year
    var selectedYear = '1930';

    // Add click events to each feature to display population density in a popup.
    function onEachFeature(feature, layer) {
  layer.on('click', function(e) {

    // Retrieve the county name and density from the feature's properties
    var countyName = feature.properties.NAME;
    var density = feature.properties[selectedYear];

    // Bind a popup that displays both the county name and population density
    layer.bindPopup("<strong>" + countyName + "</strong><br>Population Density: " + density + " persons per km²").openPopup();
  });
}

    // Add the GeoJSON layer to the map.
    var geojson = L.geoJSON(floridaData, {
      style: myStyle,
      onEachFeature: onEachFeature
    }).addTo(map);

    // Function to get color based on density
    function getDensityColor(d) {
      return d >= 500 ? "#b10026" : // Very High
             d >= 250 ? "#e31a1c" : // High
             d >= 150 ? "#fc4e2a" : // Moderate High
             d >= 75  ? "#fd8d3c" : // Moderate
             d >= 40  ? "#feb24c" : // Moderate Low
             d >= 25  ? "#fed976" : // Low
             d <= 10  ? "#ffffb2" : // Very Low
                        "#ffffb2";  // Default Color if density < 5
    }

    // Function to style GeoJSON layer
    function myStyle(feature) {
      return {
        "fillColor": getDensityColor(feature.properties[selectedYear]),
        "color": "black",  
        "weight": 0.75,
        "opacity": 2.0,
        "fillOpacity": 0.7
      };
    }

    // Function called by slider to update the map
    function moveSlider(value) {
      document.getElementById('daYear').innerHTML = 'Year: ' + value;
      selectedYear = value;
      map.closePopup();
      geojson.resetStyle();  // Reset style on the existing GeoJSON layer
    }
  
var legend = L.control({position: 'bottomright'});
legend.onAdd = function(map) {
    var div = L.DomUtil.create('div', 'info legend');
    var grades = [0, 25, 40, 75, 150, 250, 500],
        labels = [];
    for (var i = 0; i < grades.length; i++) {
        div.innerHTML += 
'<i style="background:' + getDensityColor(grades[i] + 1) + '"></i> ' +
grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + 'persons per km²'+ '<br>' : '+');
    }
    return div;

};

legend.addTo(map);
var legendTitle = L.control({position: 'bottomright'});
legendTitle.onAdd = function (map) {
    var div = L.DomUtil.create('div', 'legend-title');
    div.innerHTML = '<h4>Population Density<br>(persons per km²)</h4>';
    return div;
};

legendTitle.addTo(map);
  window.onload = function() {
      document.getElementById('year').value = 1930;}
</script>
</body>
</html>
